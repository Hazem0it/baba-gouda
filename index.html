<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Revenue System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-page" id="loginPage">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="loginUser" placeholder="اسم المستخدم">
    <input type="password" id="loginPass" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
</div>

<div class="dashboard" id="dashboard">
    <div class="sidebar">
        <h3>القائمة</h3>
        <button onclick="showPage('revenue')">تسجيل الايراد</button>
        <button onclick="showPage('debt')">المديونية 📝</button>
        <button onclick="showPage('logs')">لوج التعديلات</button>
        <button onclick="showPage('settings')">الإعدادات ⚙️</button>
        <button onclick="logout()" style="background: #e74c3c; margin-top: 40px;">تسجيل الخروج 🚪</button>
    </div>

    <div class="content">
        <div id="revenue" class="page">
            <h2>تسجيل الايراد</h2>
            <div class="form-grid">
                <div class="form-group"><label>السنة</label><select id="year"><option>2026</option><option>2027</option></select></div>
                <div class="form-group"><label>التاريخ</label><input type="date" id="date"></div>
                <div class="form-group"><label>اسم الموظف</label><select id="employee"><option>رفعت</option><option>محمد</option><option>حازم</option></select></div>
                <div class="form-group"><label>الايراد</label><input type="number" id="revenueValue"></div>
                <div class="form-group"><label>شحن الماكينه</label><input type="number" id="machine"></div>
                <div class="form-group"><label>السحب</label><input type="number" id="withdraw"></div>
                <div class="form-group"><label>الملاحظة</label><input type="text" id="note"></div>
                <div class="form-group"><label>رفع ايصال PDF</label><input type="file" id="receipt"></div>
            </div>
            <button class="btn-primary" onclick="saveData()">حفظ الإيراد</button>
            <button class="btn-secondary" onclick="showLogs()">لوج التعديلات</button>
        </div>

        <div id="debt" class="page">
            <h2>تسجيل المديونية</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>التاريخ</label>
                    <input type="date" id="debtDate">
                </div>
                <div class="form-group">
                    <label>اسم العميل</label>
                    <input type="text" id="debtClient" placeholder="اكتب اسم العميل">
                </div>
                <div class="form-group">
                    <label>مبلغ المديونية</label>
                    <input type="number" id="debtAmount" placeholder="أدخل المبلغ">
                </div>
                <div class="form-group">
                    <label>الملاحظة</label>
                    <input type="text" id="debtNote" placeholder="أي تفاصيل إضافية">
                </div>
            </div>
            <button class="btn-primary" onclick="saveDebt()">حفظ المديونية</button>
            <button class="btn-secondary" onclick="showLogs()">لوج التعديلات</button>
        </div>

        <div id="logs" class="page">
            <h2>سجل التعديلات (إيرادات ومديونيات)</h2>
            <div id="logContainer"></div>
        </div>

        <div id="settings" class="page">
            <h2>الإعدادات</h2>
            <div class="settings-box">
                <h3>🎨 مظهر النظام</h3>
                <div class="form-group">
                    <label>اختر الستايل:</label>
                    <select id="themeSelect" onchange="changeTheme()">
                        <option value="light">الوضع الفاتح (الافتراضي)</option>
                        <option value="dark">الوضع الداكن (Dark Mode)</option>
                    </select>
                </div>
            </div>

            <div class="settings-box">
                <h3>🔒 إضافة / تعديل مستخدم</h3>
                <div class="form-group">
                    <label>اسم المستخدم الجديد</label>
                    <input type="text" id="newUsername">
                </div>
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword">
                </div>
                <button class="btn-primary" onclick="addUser()">حفظ المستخدم</button>
            </div>

            <div class="settings-box">
                <h3>👥 المستخدمين المسجلين بالنظام</h3>
                <div id="usersListContainer"></div>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
